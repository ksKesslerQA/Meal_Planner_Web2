<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Meal</title>
</head>
<body>

<h2>Add new meal</h2>

<form method="post" action="/meals">

    <label>Meal name:</label><br>
    <input type="text" name="name" required>
    <br><br>

    <label>Category:</label><br>
    <select name="category" required>
        <option value="breakfast">Breakfast</option>
        <option value="lunch">Lunch</option>
        <option value="dinner">Dinner</option>
    </select>
    <br><br>

    <label>Recipe / Instructions (optional):</label><br>
    <textarea
            name="recipe"
            rows="6"
            cols="50"
            placeholder="Step 1...
Step 2...
Bake for 20 minutes...">
</textarea>
    <br><br>

    <h3>Ingredients</h3>

    <table id="ingredients-table" border="1" cellpadding="5">
        <tr>
            <th>Ingredient</th>
            <th>Amount</th>
            <th>Unit</th>
            <th></th>
        </tr>

        <!-- first ingredient row -->
        <tr>
            <td>
                <input name="ingredientName"
                       list="ingredient-options"
                       required>
            </td>
            <td>
                <input name="ingredientAmount"
                       type="number"
                       step="0.1"
                       required>
            </td>
            <td>
                <select name="ingredientUnit">
                    <option value="pcs">pcs</option>
                    <option value="g">g</option>
                    <option value="kg">kg</option>
                    <option value="ml">ml</option>
                    <option value="l">l</option>
                </select>
            </td>
            <td></td>
        </tr>
    </table>

    <br>
    <button type="button" onclick="addRow()">➕ Add ingredient</button>
    <br><br>

    <button type="submit">Save meal</button>
</form>

<br>
<a href="/">← Back</a>

<!-- ONE shared datalist for all ingredient inputs -->
<datalist id="ingredient-options"></datalist>

<script>
    async function setupIngredientAutocomplete(input) {
        input.addEventListener("input", async () => {
            const query = input.value;
            if (query.length < 2) return;

            const response = await fetch(`/api/ingredients?query=${query}`);
            const ingredients = await response.json();

            const datalist = document.getElementById("ingredient-options");
            datalist.innerHTML = "";

            ingredients.forEach(name => {
                const option = document.createElement("option");
                option.value = name;
                datalist.appendChild(option);
            });
        });
    }

    function addRow() {
        const table = document.getElementById("ingredients-table");
        const row = table.insertRow();

        row.innerHTML = `
            <td>
                <input name="ingredientName"
                       list="ingredient-options"
                       required>
            </td>
            <td>
                <input name="ingredientAmount"
                       type="number"
                       step="0.1"
                       required>
            </td>
            <td>
                <select name="ingredientUnit">
                    <option value="pcs">pcs</option>
                    <option value="g">g</option>
                    <option value="kg">kg</option>
                    <option value="ml">ml</option>
                    <option value="l">l</option>
                </select>
            </td>
            <td>
                <button type="button"
                        onclick="this.closest('tr').remove()">❌</button>
            </td>
        `;

        const input = row.querySelector("input[name='ingredientName']");
        setupIngredientAutocomplete(input);
    }

    // attach autocomplete to initial row
    document
        .querySelectorAll("input[name='ingredientName']")
        .forEach(setupIngredientAutocomplete);
</script>

</body>
</html>
