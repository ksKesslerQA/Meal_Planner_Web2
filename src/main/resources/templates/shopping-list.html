<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shopping list</title>
</head>
<body>

<h2>🛒 Shopping list</h2>

<ul>
    <li th:each="ingredient : ${ingredients}">
        <span th:text="${ingredient.name}"></span> —
        <span th:text="${ingredient.amount}"></span>
        <span th:text="${ingredient.unit.label}"></span>
    </li>
</ul>
<br><br>

<a href="/shopping-list/download">
    <button>⬇ Download shopping list</button>
</a>


<br><br>
<a href="/">← Back</a>

</body>
</html>
